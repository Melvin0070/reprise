# Workspace layout follows the module paths the plan already names
# (flagship-design-plan.md — "Files:" lines on each T-task).
# Packages are created only as the walking skeleton needs them; these globs
# match nothing until then, which is intentional.
packages:
  - "api"
  - "worker"
  - "shared/*"
  - "web"
  - "hocuspocus"

# Single source of truth for shared dependency versions. Packages reference
# these with "catalog:" so a version is pinned once, not per-package.
catalog:
  "@types/node": 26.1.1
  typescript: 7.0.2
  vitest: 4.1.10
