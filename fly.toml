# Fly.io deploy config for the Reprise API (issue #4).
#
# The locked target: Fly Machines are Firecracker microVMs with their own
# kernel, which is what the custom sandbox needs and what every managed PaaS
# denies (see docs/notebook.md, 2026-07-25). The image built here is
# infra/Dockerfile — the same artifact infra/smoke-image.sh proves end to end.

# Globally unique on Fly. If `fly launch` reports this taken, pick another and
# update this line — the URL is derived from it, so choose deliberately once.
app = "reprise-api"
primary_region = "sin"

[build]
dockerfile = "infra/Dockerfile"

# REPRISE_API_KEY is NOT here. Secrets never enter the repo; set it once with
#   fly secrets set REPRISE_API_KEY=$(openssl rand -hex 32)
# and the server reads it at boot (OV-1). REPRISE_RUN_UID/GID are baked into the
# image, so they need no restating here.

[http_service]
internal_port = 3000
force_https = true

# Scale-to-zero: the machine sleeps when idle and Fly Proxy wakes it on the
# next request (~2s cold start, invisible in a demo). A stopped machine bills
# storage only. min_machines_running = 0 is the floor that makes idle ~$0.
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0

# Concurrency ceiling as a backpressure and billing control, not tuning: each
# inline run spawns a memory-capped python child, so a flood of concurrent
# requests is bounded here rather than left to OOM the machine. Observing that
# the inline path blocks under load is the point of the budgeted downgrade
# (docs/learning-log/001-inline-execution.md); this only stops it crashing.
[http_service.concurrency]
type = "requests"
hard_limit = 25
soft_limit = 20

# One small machine. 512MB gives the Node parent headroom above the jailed
# child's RLIMIT_AS. Worst-case cost is bounded by machine count × size × 730h
# because Fly never auto-provisions past what is declared (docs/notebook.md).
[[vm]]
size = "shared-cpu-1x"
memory = "512mb"

# No health check yet: every route answers 401/404 without a key, so an HTTP
# check has no 2xx to hit. A public /healthz with a real check is DX8, deferred
# with the rest of the startup-preflight work.
