# Dependency updates.
#
# Three ecosystems, because the repo has three supply chains and they carry very
# different risk. Listed in order of blast radius, worst first:
#
#   docker   — infra/Dockerfile is the artifact fly.toml deploys, and its apt
#              layer IS the jail's userland: util-linux's `prlimit` applies the
#              rlimits, python3 is the only v1.0 runtime. A CVE there is a CVE
#              in the thing that runs untrusted code.
#   actions  — an action executes inside CI with whatever scope the workflow
#              grants it. ci.yml now grants `contents: read` and references no
#              secrets, which is what actually bounds this; the schedule below
#              only keeps versions fresh.
#   npm      — application dependencies, none of which run in the sandbox.
version: 2

updates:
  # The base image is a MUTABLE tag (node:24-bookworm-slim), deliberately: a
  # rebuild pulls current 24.x patches without anyone filing a bump. What that
  # does NOT give is a trigger — nothing schedules the rebuild, and nothing
  # proposes the major. This entry supplies the second half. It does not make
  # the image reproducible; digest pinning would, at the cost of the automatic
  # patch freshness, and that trade is not settled (docs/notebook.md).
  #
  # VERIFIED 2026-09-08, first run: both directories were scanned and each
  # produced a PR, so the non-default `linux-test.Dockerfile` filename is picked
  # up and needs no rename. Both landed as node 24 -> 26 majors, which is the
  # point of the entry — nothing else in the repo would have proposed that.
  - package-ecosystem: docker
    directories:
      - /infra
      - /infra/dev
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(infra)"

  # Version freshness only. It does NOT defend against a moved tag: ci.yml
  # references floating majors (actions/checkout@v7, pnpm/action-setup@v6), and
  # an attacker who force-moves `v6` onto a malicious commit leaves the version
  # looking current, so Dependabot opens nothing. SHA pinning is the control for
  # that; the open decision is recorded in docs/notebook.md.
  #
  # Majors excluded from the group for the same reason as npm below — an action
  # major is a behaviour change (v4->v5 changed the default runtime), and under
  # a loop that merges on green it would otherwise land unread inside a patch
  # bundle that CI has no reason to fail.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(ci)"

  # One entry for the whole workspace: api/, worker/ and shared/* resolve
  # through the root pnpm-lock.yaml.
  #
  # The three catalog-pinned devDependencies are ignored on purpose. They live in
  # pnpm-workspace.yaml's `catalog:` block and appear in each package.json only
  # as "catalog:", which Dependabot does not yet handle correctly — two open
  # upstream bugs, both verified against the tracker rather than recalled:
  #
  #   dependabot-core#14339 (open, 2026-03-03) — a catalog dependency's committed
  #     lockfile update DROPS an entry from the catalogs block. That lockfile then
  #     fails `pnpm install --frozen-lockfile`, which is the first step of the
  #     verify job, so the PR lands red and stuck.
  #   dependabot-core#16049 (open, 2026-08-27) — a catalog dependency that also
  #     resolves elsewhere in the lockfile (routine for exactly these three)
  #     resolves to the wrong version or raises NoChangeError and opens nothing.
  #
  # Ignoring them trades automation for a lockfile that stays installable. The
  # cost is real and named: these three now go stale unless bumped by hand in
  # pnpm-workspace.yaml. Revisit when either issue closes.
  #
  # VERIFIED 2026-09-08, first run: seven PRs opened, none touching the catalog
  # trio or pnpm-workspace.yaml — so the ignore holds and neither upstream bug
  # was triggered.
  #
  # Grouped because the loop merges on green and twelve single-dependency PRs a
  # week would bury the milestone work. The bill is bisection: a red group names
  # the failing gate, not the failing package. Splitting means an `ignore` entry
  # plus @dependabot recreate. Majors stay ungrouped so they arrive alone.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # A lockstep family: @nestjs/core@12 imports @nestjs/common/internal, a
      # subpath that only exists in @nestjs/common@12. Bumped one at a time they
      # produce ERR_MODULE_NOT_FOUND at runtime, so four separate major PRs were
      # four PRs that could never go green (#69-#72, 2026-09-08). Deliberately
      # includes majors, which is the exception to the rule below — the reason
      # majors normally arrive alone is that they should be read one at a time,
      # and that does not apply to packages which cannot move independently.
      nestjs:
        patterns: ["@nestjs/*"]
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "@types/node"
      - dependency-name: "typescript"
      - dependency-name: "vitest"
    commit-message:
      prefix: "chore(deps)"
