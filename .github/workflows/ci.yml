name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repo: it checks out, installs, and runs the three
# gates. Naming that explicitly keeps the job token from carrying write scopes a
# compromised action in the dependency chain could spend.
permissions:
  contents: read

# A red CI is a stop-the-line event, so never let two runs race on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The three gates of `pnpm verify`, run as separate steps so a failure
      # names which one broke. CI runs exactly these three (CLAUDE.md).
      - name: ultracite check
        run: pnpm ultracite check

      - name: typecheck
        run: pnpm -r typecheck

      - name: test
        run: pnpm -r test

  # The isolation suite cannot ride the job above: it needs Linux (macOS does
  # not enforce RLIMIT_AS) and root (the jail drops to an unprivileged uid, and
  # you cannot drop a privilege you do not hold — the `runner` user gets EPERM).
  # Building the same image used by `pnpm test:linux` keeps the local loop and
  # CI byte-identical rather than merely similar (OV-8).
  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: build the Linux test image
        run: docker build -q -f infra/dev/linux-test.Dockerfile -t reprise-linux-test .

      - name: isolation suite
        run: docker run --rm reprise-linux-test

  # The production image, proven end to end against the artifact that deploys:
  # it boots, enforces the OV-1 gate, and runs the walking skeleton in the jail
  # inside the container. A superset of api/src/main.smoke.test.ts (which needs
  # a build the verify job does not do) — so that test stays a fast local check
  # and this is its authoritative CI proof. Cannot ride the verify job: it needs
  # Docker and Linux, like the isolation suite above.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: production image serves the walking skeleton
        run: bash infra/smoke-image.sh
