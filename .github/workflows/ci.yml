name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repo: it checks out, installs, and runs the three
# gates. Naming that explicitly keeps the job token from carrying write scopes a
# compromised action in the dependency chain could spend. It bounds blast radius
# rather than preventing anything — a compromised action still runs code on the
# runner and still sees the source; what it cannot do is push here or publish
# under this repo's identity. Small residual today because no job reads a secret.
#
# The planned container-publish/deploy job will need `packages: write` declared
# at ITS job level, or it fails with "Resource not accessible by integration".
# Deliberate: a loud pre-merge failure beats carrying an unused write scope.
permissions:
  contents: read

# A red CI is a stop-the-line event, so never let two runs race on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The three gates of `pnpm verify`, run as separate steps so a failure
      # names which one broke. CI runs exactly these three (CLAUDE.md).
      - name: ultracite check
        run: pnpm ultracite check

      - name: typecheck
        run: pnpm -r typecheck

      - name: test
        run: pnpm -r test

  # The isolation suite cannot ride the job above: it needs Linux (macOS does
  # not enforce RLIMIT_AS) and root (the jail drops to an unprivileged uid, and
  # you cannot drop a privilege you do not hold — the `runner` user gets EPERM).
  # Building the same image used by `pnpm test:linux` keeps the local loop and
  # CI byte-identical rather than merely similar (OV-8).
  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: build the Linux test image
        run: docker build -q -f infra/dev/linux-test.Dockerfile -t reprise-linux-test .

      # `--init` gives the container a PID 1 that reaps reparented orphans, the
      # way Fly's `/.fly/init` does in production. Without it a fork bomb's
      # SIGKILLed children stay zombies, and zombies still hold slots in the
      # per-uid RLIMIT_NPROC budget the jail depends on — later runs would fail
      # to spawn while the reap kept reporting a clean uid (#78).
      - name: isolation suite
        run: docker run --init --rm reprise-linux-test

  # The production image, proven end to end against the artifact that deploys:
  # it boots, enforces the OV-1 gate, and runs the walking skeleton in the jail
  # inside the container. A superset of api/src/main.smoke.test.ts (which needs
  # a build the verify job does not do) — so that test stays a fast local check
  # and this is its authoritative CI proof. Cannot ride the verify job: it needs
  # Docker and Linux, like the isolation suite above.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: production image serves the walking skeleton
        run: bash infra/smoke-image.sh

      # The 6PN deploy preflight (#79), self-tested on fixtures. It rides this
      # `image` job rather than `verify` because it is an infra guard and `pnpm
      # verify` is exactly three gates and stays that way; it needs no Docker,
      # and it is far too small to justify a fourth required status check. The
      # cost of folding it in: a red `image` no longer means only "the image is
      # broken" — read which step failed. What CI proves here is the decision
      # logic, not the org; the live check needs Fly credentials and runs at
      # deploy time via `pnpm preflight:org`.
      #
      # Node is pinned rather than taken from whatever ubuntu-latest ships,
      # because the check IS a node script and the rest of the repo runs on
      # .nvmrc. The step above needs none of this: it runs inside Docker.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      #
      # No Fly token is wired in here, deliberately: the fixtures need none, and
      # a token in CI would be a standing credential for an org whose whole
      # security story is that workers hold none (OV-10). If a later slice adds
      # a deploy job, the preflight belongs there with its own credential -- and
      # note that an app-scoped deploy token cannot answer this question, since
      # its view of the org is one app (docs/threat-model.md).
      - name: deploy preflight refuses a populated Fly org
        run: bash infra/preflight-org.test.sh

      # The pnpm pin guards (#89), self-tested on fixtures, riding this job for
      # the same reasons as the preflight above: infra guards, no Docker needed,
      # far too small for a fourth required check.
      #
      # The smoke step at the top of this job already exercises the happy path
      # inside a real image build. What these two add is the refusals — the half
      # that matters, and the half a passing build cannot show. The defect they
      # exist for had two independent halves, so it takes two files: the
      # resolver's regex (an unvalidated `packageManager` installs and runs an
      # arbitrary package as root at image build) and the installer's shell
      # structure (a command substitution in argument position discards its exit
      # status, so an empty pin installed `latest` on a fully green build).
      # Both are pinned, so a simplification back to an inline `node -p` turns
      # this red instead of shipping.
      - name: the pnpm pin resolver refuses everything but a plain semver
        run: bash infra/pnpm-version.test.sh

      - name: the pnpm installer stops before npm when the pin is refused
        run: bash infra/install-pnpm.test.sh
